# One conda env for ALL notebooks (001-006, 01-10, and the learn/ notebook): R + Python in the same place.
# Everything comes from conda-forge / bioconda as PRECOMPILED binaries,
# which is why GEOquery installs here without the XVector compile error.
name: endotypes
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - git                      # clone / pull the repo from a terminal
  - gh                       # GitHub command line (gh auth login, gh repo clone), as in Anne's workflow
  - ipykernel
  - pandas
  - numpy
  - matplotlib
  - openpyxl
  - r-base=4.4
  - r-irkernel
  - r-biocmanager
  - r-data.table
  - r-readxl
  - bioconductor-biobase
  - bioconductor-geoquery
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-sva
  - bioconductor-illuminahumanv4.db
  - r-wgcna                  # notebook 09 (gene modules); installed from conda-forge as a binary
