# One conda env for ALL notebooks (001-006, 01-10, and the learn/ notebook): R + Python in the same place.
# Everything comes from conda-forge / bioconda as PRECOMPILED binaries,
# which is why GEOquery installs here without the XVector compile error.
name: endotypes-transcriptomics
channels:
  - conda-forge
  - bioconda
  - nodefaults
channel_priority: strict
dependencies:
  - python=3.11
  - pip
  - git                      # clone / pull the repo from a terminal
  - gh                       # GitHub command line (gh auth login, gh repo clone), as in Anne's workflow
  - ipykernel
  - pandas
  - numpy
  - scipy                    # added: pvclust-py dependency, now managed by conda
  - scikit-learn             # added: pvclust-py dependency
  - matplotlib
  - typer                    # added: pvclust-py dependency
  - openpyxl
  - r-base=4.4
  - r-irkernel
  - r-biocmanager
  - r-data.table
  - r-readxl
  - bioconductor-biobase
  - bioconductor-geoquery
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-sva
  - bioconductor-illuminahumanv4.db
  - r-wgcna                  # notebook 09 (gene modules); installed from conda-forge as a binary
  - pip:
      # pinned to an exact commit so rebuilds are reproducible
      - git+https://github.com/NIH-NLM/pvclust-py.git@6b0c3bf8aea04f67e8e1ce4ac7bf2e46d0d13224
